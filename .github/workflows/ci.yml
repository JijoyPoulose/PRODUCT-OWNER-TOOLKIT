name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test the example backlog report
        run: python automation/scripts/backlog_health.py examples/sample-backlog.csv --today 2026-09-23 > /dev/null
